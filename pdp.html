
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Property Details | GrandSignature Properties</title>
<meta content="Explore property details and enquire with GrandSignature Properties." name="description"/>
<style>
    :root {
      --dark: #191919;
      --gold: #d4af37;
      --gold-dark: #98720c;
      --light: #f7f8fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #292929;
      line-height: 1.6;
    }

    a { color: inherit; }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 5%;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--dark);
    }

    nav {
      max-width: 1300px;
      margin: auto;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .logo span { color: var(--gold); }

    nav ul {
      display: flex;
      gap: 27px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav ul a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav ul a:hover,
    nav ul a.active { color: var(--gold); }

    .menu-toggle {
      display: none;
      border: 0;
      background: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 40px;
      margin: 45px 0 80px;
    }

    .main-img {
      display: block;
      width: 100%;
      height: min(55vw, 520px);
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .property-header {
      padding-bottom: 22px;
      margin: 25px 0;
      border-bottom: 1px solid #eee;
    }

    .eyebrow {
      color: var(--gold-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .property-header h1 {
      margin: 10px 0;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.2;
    }

    .location { color: #666; }

    .description h2 {
      margin-top: 28px;
      font-size: 21px;
    }

    .description p { color: #555; }

    .specifications {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .spec-item {
      padding: 15px;
      background: var(--light);
      border-radius: 5px;
      font-weight: 600;
    }

    .sidebar {
      position: sticky;
      top: 110px;
      align-self: start;
    }

    .price-card {
      padding: 30px;
      background: var(--dark);
      color: white;
      border-radius: 8px;
      text-align: center;
    }

    .price-card strong {
      display: block;
      margin: 10px 0;
      color: var(--gold);
      font-size: 26px;
    }

    .price-card p { color: #ddd; }

    .primary {
      display: inline-block;
      padding: 13px 24px;
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: var(--dark);
      font-weight: 750;
      text-align: center;
      text-decoration: none;
    }

    .primary:hover { background: #c7a12b; }

    .inquiry-btn {
      display: block;
      margin-top: 22px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--gold-dark);
      font-weight: 700;
    }

    .missing {
      padding: 90px 10%;
      text-align: center;
    }

    footer {
      padding: 65px 0 24px;
      background: var(--dark);
      color: white;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr repeat(3, 1fr);
      gap: 28px;
    }

    .footer-logo {
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }

    .footer-logo span { color: var(--gold); }

    .footer-col h3 {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .footer-col p,
    .footer-col a {
      color: #aaa;
      font-size: 13px;
    }

    .footer-col ul {
      padding: 0;
      list-style: none;
    }

    .footer-col li { margin-bottom: 10px; }
    .footer-col li a { text-decoration: none; }
    .footer-col li a:hover { color: var(--gold); }

    .footer-bottom {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid #383838;
      color: #999;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 1000px) {
      .detail-layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 650px) {
      .menu-toggle { display: block; }

      nav ul {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        padding: 20px 5%;
        background: var(--dark);
        flex-direction: column;
      }

      nav ul.show { display: flex; }
      .main-img { height: 270px; }
      .specifications { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr; }
    }
  </style>
<link href="global.css" rel="stylesheet"/></head>
<body>
<div id="gs-header"></div>
<div class="container">
<div id="detailRoot"></div>
</div>
<div id="gs-footer"></div>
<script src="properties-data.js"></script>
<script>
  

  const params = new URLSearchParams(window.location.search);
  const propertyId = params.get("id");
  const allProperties = window.GRAND_PROPERTIES || [];

  const property = allProperties.find(
    item => item.id === propertyId
  );

  const root = document.getElementById("detailRoot");

  function makeElement(tag, className = "", text = "") {
    const element = document.createElement(tag);

    if (className) element.className = className;
    element.textContent = text;

    return element;
  }

  function imagePlaceholder() {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="1100" height="700"
           viewBox="0 0 1100 700">
        <rect width="1100" height="700" fill="#242424"/>
        <text x="550" y="350"
              fill="#d4af37"
              font-family="Arial"
              font-size="34"
              text-anchor="middle">
          Property photo unavailable
        </text>
      </svg>
    `;

    return "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(svg);
  }

  if (!property) {
    document.title = "Property Not Found | GrandSignature";

    const missing = makeElement("section", "missing");
    const heading = makeElement(
      "h1", "", "Property not found"
    );

    const message = makeElement(
      "p",
      "",
      "Return to the Portfolio and select a property."
    );

    const link = makeElement(
      "a", "primary", "Browse Properties"
    );

    link.href = "portfolio.html";

    missing.append(heading, message, link);
    root.appendChild(missing);

  } else {
    document.title =
      property.title + " in " + property.city +
      " | GrandSignature Properties";

    const layout = makeElement("div", "detail-layout");
    const main = makeElement("main");
    const sidebar = makeElement("aside", "sidebar");

    // PROPERTY IMAGE

    const image = makeElement("img", "main-img");
    image.src = property.image;
    image.alt =
      property.title + " — illustrative property photograph";

    image.onerror = function () {
      this.onerror = null;
      this.src = imagePlaceholder();
    };

    main.appendChild(image);

    // PROPERTY HEADING

    const propertyHeader = makeElement(
      "div", "property-header"
    );

    const eyebrow = makeElement(
      "span",
      "eyebrow",
      property.type === "apartment"
        ? "Apartment"
        : "Residential Property"
    );

    const heading = makeElement(
      "h1", "", property.title
    );

    const location = makeElement(
      "p",
      "location",
      "📍 " + property.area + ", " +
      property.city + ", Nigeria"
    );

    propertyHeader.append(eyebrow, heading, location);
    main.appendChild(propertyHeader);

    // PROPERTY OVERVIEW

    const description = makeElement(
      "div", "description"
    );

    const overviewTitle = makeElement(
      "h2", "", "Property Overview"
    );

    const overview = makeElement(
      "p",
      "",
      property.description ||
      "Explore this residential property in " +
      property.area + ", " + property.city +
      ". Contact our team for additional information."
    );

    description.append(overviewTitle, overview);

    // PROPERTY SPECIFICATIONS

    const specsTitle = makeElement(
      "h2", "", "Property Information"
    );

    const specs = makeElement(
      "div", "specifications"
    );

    const items = [
      "Property Type: " +
        (property.type === "apartment"
          ? "Apartment"
          : "Residential"),
      "Location: " + property.area + ", " + property.city,
      "Bedrooms: " + (property.bedrooms ?? "To be confirmed"),
      "Bathrooms: " + (property.bathrooms ?? "To be confirmed"),
      "Floor Area: " + (property.floorArea || "To be confirmed"),
      "Title Documents: " +
        (property.titleDocuments || "To be verified")
    ];

    items.forEach(text => {
      specs.appendChild(
        makeElement("div", "spec-item", text)
      );
    });

    description.append(specsTitle, specs);

    const enquiryTitle = makeElement(
      "h2", "", "Property Enquiries"
    );

    const enquiryText = makeElement(
      "p",
      "",
      "Contact GrandSignature Properties for information " +
      "about property viewings, documentation and pricing. " +
      "All details should be independently verified."
    );

    description.append(enquiryTitle, enquiryText);
    main.appendChild(description);

    // PRICE APPEARS ON PDP ONLY

    const priceCard = makeElement(
      "div", "price-card"
    );

    const priceLabel = makeElement(
      "span", "eyebrow", "Property Price"
    );

    const price = makeElement(
      "strong",
      "",
      property.price || "Price to be confirmed"
    );

    const priceNote = makeElement(
      "p",
      "",
      "Please confirm current pricing and availability."
    );

    // WHATSAPP ENQUIRY

    const message =
      "Hello GrandSignature, I would like information " +
      "about " + property.title + " in " +
      property.area + ", " + property.city +
      ". Please share current details and pricing.";

    const inquiryButton = makeElement(
      "a",
      "primary inquiry-btn",
      "Enquire on WhatsApp"
    );

    inquiryButton.href =
      "https://wa.me/2348114452433?text=" +
      encodeURIComponent(message);

    inquiryButton.target = "_blank";
    inquiryButton.rel = "noopener noreferrer";

    priceCard.append(
      priceLabel,
      price,
      priceNote,
      inquiryButton
    );

    sidebar.appendChild(priceCard);

    const backLink = makeElement(
      "a",
      "back-link",
      "← Back to " + property.city + " Properties"
    );

    backLink.href =
      "portfolio.html?city=" +
      encodeURIComponent(property.city);

    sidebar.appendChild(backLink);

    layout.append(main, sidebar);
    root.appendChild(layout);
  }
</script>
<script src="global.js"></script></body>
</html>
